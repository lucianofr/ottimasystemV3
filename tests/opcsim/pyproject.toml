[project]
name = "opcsim"
version = "0.1.0"
description = "OttimaSystem: servidor OPC-UA de simulação para testes do opc-worker (dev-only)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncua>=2.0",
  # importada diretamente para gerar o certificado autoassinado do servidor; já é
  # dependência obrigatória do asyncua, não é dependência nova do projeto.
  "cryptography>=43.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opcsim"]
