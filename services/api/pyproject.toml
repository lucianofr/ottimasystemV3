[project]
name = "ottima-api"
version = "0.1.0"
description = "OttimaSystem: API REST (auth, CRUD)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ottima-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
ottima-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ottima_api"]
