[project]
name = "ottima-flow-runtime"
version = "0.1.0"
description = "OttimaSystem: motor de flows (F1: esqueleto)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ottima-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "numpy>=2.5",
]

[tool.uv.sources]
ottima-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ottima_flow_runtime"]
