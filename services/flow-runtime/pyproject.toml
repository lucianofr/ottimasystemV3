[project]
name = "ottima-flow-runtime"
version = "0.1.0"
description = "OttimaSystem: motor de flows (F1: esqueleto)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ottima-core",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "numpy>=2.5",
  # Montagem do MPC (spec F4 §3): casadi vem transitivo. Só a discretização por par
  # (tarefa 2.1) chega nesta leva; o modelo do-mpc em si nasce na tarefa 2.2.
  "do-mpc>=5.1",
  # SSTO (ADR-026 §7): `linprog(method="highs")` é o backend LP default. Já vinha
  # transitivo por do-mpc — dependência usada de propósito é dependência declarada.
  "scipy>=1.14",
  # Backend QP do detuning anti-flipping (ADR-026 §8).
  "osqp>=1.0",
]

[tool.uv.sources]
ottima-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ottima_flow_runtime"]
