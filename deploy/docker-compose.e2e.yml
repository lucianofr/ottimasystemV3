# Override de teste (spec F2 §10.4): publica em 127.0.0.1 a porta do Redis que a
# suite L2 precisa alcancar a partir do host. Producao continua com 8 servicos e
# uma unica porta (ADR-023) — este arquivo nunca sobe sem ser pedido explicitamente.
#
# O simulador OPC-UA nao faz mais parte da stack: o opc-worker e so cliente (spec
# F2 §2.2). Quando a suite e2e precisa de um servidor OPC, ela sobe o opcsim como
# processo standalone no host (ver tests/e2e/conftest.py), nunca como servico do
# compose.
services:
  redis:
    # A suite L2 publica em opc.writes e assina events a partir do host.
    ports:
      - "127.0.0.1:${OTTIMA_E2E_REDIS_PORT:-6379}:6379"
