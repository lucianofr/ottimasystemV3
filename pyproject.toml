[project]
name = "ottima-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*", "tests/opcsim"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers>=4.8",
  "httpx>=0.27",
  # Cliente WebSocket da L2 (E2E-F3-09, RF-305). Já vinha no ambiente por `uvicorn[standard]`,
  # mas a suíte o importa direto: transitiva usada de propósito é dependência declarada.
  "websockets>=13",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "services", "tests"]
markers = ["e2e: testes end-to-end contra o stack docker compose (fora do run default)"]
# --import-mode=importlib: os serviços têm tests/test_health.py homônimos sem __init__.py
addopts = "-m 'not e2e' --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
# docs/ guarda documentos normativos e planos (artefatos históricos), não código-fonte:
# o ruff não deve reformatar os blocos Python embutidos neles.
extend-exclude = ["docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Security no default do parâmetro é o idioma do FastAPI (B008 não se aplica)
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.ruff.lint.isort]
known-first-party = ["ottima_core", "ottima_api", "ottima_opc_worker", "ottima_flow_runtime", "ottima_recorder", "opcsim"]
