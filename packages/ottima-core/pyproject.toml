[project]
name = "ottima-core"
version = "0.1.0"
description = "OttimaSystem: modelos, schemas, contratos do barramento e segurança compartilhados"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "alembic>=1.14",
  "cryptography>=43.0",
  "redis>=5.2",
  "pwdlib[argon2]>=0.2",
  "pyjwt>=2.10",
  # Escopo do script do usuário (ADR-018): `script_pool` injeta `math` e `numpy` e nada mais.
  # Vive no core porque flow-runtime (bloco Script) e calc-worker (tag calculada) o dividem.
  "numpy>=2.5",
  # Motor de inferência do bloco Fuzzy (RF-541): validação de CONTEÚDO do FLL roda em
  # `flowgraph.validate.validate_graph` no save, via import lazy (ADR-029).
  "pyfuzzylite>=8.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ottima_core"]
