[project]
name = "ottima-core"
version = "0.1.0"
description = "OttimaSystem: modelos, schemas, contratos do barramento e segurança compartilhados"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "alembic>=1.14",
  "cryptography>=43.0",
  "redis>=5.2",
  "pwdlib[argon2]>=0.2",
  "pyjwt>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ottima_core"]
